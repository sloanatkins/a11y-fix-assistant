<!doctype html>
<!-- Fictional site with planted accessibility problems, used only to demo the tool. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Family Clinic appointments</title>
<style>
@font-face { font-family: "Bricolage"; src: url("../fonts/bricolage-grotesque-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Bricolage, Verdana, sans-serif; font-size: 18px; color: #0d3634; background: #eaf6f3; }
header { display: flex; justify-content: space-between; align-items: center; padding: 16px clamp(20px, 5vw, 64px); background: #fff; }
.name { font-size: 24px; font-weight: 800; color: #0f5c5a; }
header img { display: block; width: 44px; height: 44px; }
main { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(24px, 4vw, 56px); max-width: 1240px; margin: 0 auto; padding: clamp(32px, 5vw, 64px) clamp(20px, 5vw, 64px); }
h1 { margin: 0 0 12px; font-size: clamp(44px, 6vw, 76px); line-height: .98; font-weight: 800; letter-spacing: -.03em; }
.note { margin: 0 0 28px; color: #94bdb8; font-size: 18px; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 24px; border-radius: 16px; background: #fff; }
input, select, textarea { width: 100%; padding: 14px; border: 2px solid #0f5c5a; border-radius: 10px; background: #fff; color: #0d3634; font: inherit; }
textarea, select, .send, input[type="tel"] { grid-column: 1 / -1; }
.send { padding: 16px 20px; border: 0; border-radius: 10px; background: #79c4bc; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
.team { display: grid; grid-template-columns: 120px 1fr; gap: 20px; align-items: center; margin-bottom: 32px; padding: 20px; border-radius: 16px; background: #0f5c5a; color: #fff; }
.team img { display: block; width: 120px; height: 120px; }
.team h2 { margin: 0 0 6px; font-size: 26px; }
.team p { margin: 0; line-height: 1.35; }
.find { margin: 0 0 12px; font-size: 26px; }
.map { display: block; width: 100%; height: 300px; border: 0; border-radius: 16px; }
footer { padding: 24px clamp(20px, 5vw, 64px); background: #fff; }
footer p { margin: 0; }
@media (max-width: 860px) { main, form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <span class="name">Harbor Family Clinic</span>
  <a href="#call"><img src="phone.svg" width="44" height="44"></a>
</header>
<main>
  <section>
    <h1>See a doctor who knows your name</h1>
    <p class="note">We usually reply within one business day.</p>
    <form action="#">
      <input type="text" name="full_name" placeholder="Full name">
      <input type="email" name="email" placeholder="Email">
      <input type="tel" name="phone">
      <select name="visit_type"><option>Annual checkup</option><option>Sick visit</option><option>Vaccination</option></select>
      <textarea name="details" rows="4"></textarea>
      <button class="send" type="submit">Request appointment</button>
    </form>
  </section>
  <section>
    <div class="team">
      <img src="doctor.svg" width="120" height="120">
      <div><h2>Meet Dr. Rivera</h2><p>Caring for families in this neighborhood for twelve years.</p></div>
    </div>
    <h2 class="find">Find us at 40 Harbor Road</h2>
    <iframe class="map" srcdoc="<!doctype html><html lang=en><body style=margin:0><svg xmlns=http://www.w3.org/2000/svg viewBox='0 0 600 300' style=display:block;width:100%><rect width=600 height=300 fill=#dcefe9 /><path d='M0 215q150-55 300 0t300-15v100H0z' fill=#a5d8e6 /><g stroke=#fff stroke-width=12 fill=none><path d='M40 0l80 300M300 0l-40 300M0 90h600M450 0l50 300'/></g><circle cx=282 cy=90 r=16 fill=#e4572e /><circle cx=282 cy=90 r=6 fill=#fff /></svg></body></html>"></iframe>
  </section>
</main>
<footer><p>Fictional clinic, created for a software demo. Do not enter real health information.</p></footer>
</body>
</html>
